version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/app-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rails:
        patterns:
          - "rails"
          - "railties"
          - "action*"
          - "active*"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
